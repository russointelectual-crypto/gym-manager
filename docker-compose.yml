services:
  mysql:
    image: mysql:8.4
    container_name: gym-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gym_manager
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: gym_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
