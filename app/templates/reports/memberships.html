{% extends "appbuilder/base.html" %}
{% block content %}<div class="container-fluid"><h2>Reporte de membresías</h2><form method="get" class="form-inline" style="margin: 20px 0"><label>Estado <select class="form-control" name="status"><option value="">Todos</option>{% for value in ['Activa','Vencida','Suspendida'] %}<option {% if status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><button class="btn btn-primary" style="margin-left:10px">Filtrar</button></form><table class="table table-bordered table-striped"><thead><tr><th>Plan</th><th>Estado</th><th>Clientes</th><th>Ingreso mensual estimado</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.plan_name }}</td><td>{{ row.status }}</td><td>{{ row.members }}</td><td>Bs {{ '%.2f'|format(row.monthly_revenue) }}</td></tr>{% else %}<tr><td colspan="4">No hay membresías.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
